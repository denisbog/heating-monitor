name = "monitoring"
main = "build/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[build]
command = "worker-build --release"

# Cron: every 15 minutes. Free plan allows 3 triggers and a 10 ms CPU budget/run.
[triggers]
crons = ["*/15 * * * *"]

# Static chart page is served straight from ./assets (unmetered on Free).
# Only /api/* wakes the Worker.
[assets]
directory = "./assets"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "monitoring"
database_id = "d45cf3dc-1c84-4cb0-b5fb-1dac738c5d77"

[vars]
# Non-secret config.  Secrets go in via `wrangler secret put` (or .dev.vars locally).
ILETCOMFORT_REGION = "eu"
POLL_DEVICES = "all"

# Secrets expected (never commit):
#   ILETCOMFORT_USERNAME, ILETCOMFORT_PASSWORD
#   CAMECONNECT_USERNAME, CAMECONNECT_PASSWORD,
#   CAMECONNECT_CLIENT_ID, CAMECONNECT_CLIENT_SECRET
#   API_TOKEN            (bearer token the desktop app / chart page uses)
